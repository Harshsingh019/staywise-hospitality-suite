name: Bootstrap full source and deploy Staywise demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore complete project tree
        run: |
          if [ -f staywise-source.tar.gz ]; then
            mkdir -p /tmp/staywise-source
            tar -xzf staywise-source.tar.gz -C /tmp/staywise-source
            rm -rf /tmp/staywise-source/.git /tmp/staywise-source/.github
            find /tmp/staywise-source -name '._*' -type f -delete
            find /tmp/staywise-source -name '.DS_Store' -type f -delete
            cp -R /tmp/staywise-source/. .
            rm -rf /tmp/staywise-source staywise-source.tar.gz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Restore complete Staywise project source"
            git push
          fi
      - name: Install dependencies
        run: npm install
      - name: Verify API rules
        run: npm test
      - name: Build demo
        run: npm run build --workspace client
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_MODE: ${{ vars.VITE_API_URL == '' }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
